name: Backend CI
permissions:
  # El trabajo solo necesita leer codigo; no recibe permiso de escritura al repositorio.
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: '0'
      DATABASE_URL: postgres://validation:example@127.0.0.1/convoca_ci
      DB_SSL: 'false'
      JWT_SECRET: ci-solo-pruebas-sin-valor-en-produccion-2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Backend and security regression tests
        run: node --test test/lab/*.test.js test/security/*.test.js

      - name: Security dependency audit
        # Bloquea altas/criticas de ejecucion; no oculta los riesgos dev documentados.
        run: npm audit --omit=dev --audit-level=high
        # Solo runtime bloquea por altas/criticas. Los riesgos dev se documentan en A14.
