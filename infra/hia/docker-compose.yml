# Volúmenes v2 NUEVOS: no reutilizar el volumen /bitnami/postgresql anterior.
services:
  db-principal:
    image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configurar infra/hia/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar infra/hia/.env}
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:${LAB_DB_PORT:-5435}:5432"]
    volumes:
      - principal_v2:/var/lib/postgresql/data
      - ./postgresql/logging.conf:/etc/postgresql/lab.conf:ro
      - ./postgresql/pg_hba.conf:/etc/postgresql/lab_hba.conf:ro
      - logs_v2:/var/log/postgresql
      - ./backups:/backups
      - ./backup.sh:/usr/local/bin/backup-lab:ro
    entrypoint: [sh, -c, 'chown postgres:postgres /var/log/postgresql && exec docker-entrypoint.sh "$${@}"', '--']
    command: [postgres, -c, config_file=/etc/postgresql/lab.conf, -c, wal_level=replica, -c, max_wal_senders=10, -c, max_replication_slots=5]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d postgres']
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [convoca-red]
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.9@sha256:5d9624a93634d1c5e595619cc57b1d330758120d1baf445fa97300c0c1fc3c0a
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Configurar infra/hia/.env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Configurar infra/hia/.env}
    ports: ["127.0.0.1:${LAB_PGADMIN_PORT:-5050}:80"]
    volumes: [pgadmin_v2:/var/lib/pgadmin]
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1/misc/ping || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [convoca-red]
    restart: unless-stopped

  # A6: rol de replicación local. Solo se ejecuta al activar el perfil replica.
  replication-init:
    image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    profiles: [replica]
    environment:
      PGHOST: db-principal
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Configurar REPLICATION_PASSWORD en infra/hia/.env}
    volumes:
      - ./postgresql/crear-rol-replicacion.sql:/docker-entrypoint-initdb.d/crear-rol-replicacion.sql:ro
    entrypoint: [psql]
    command: [-X, -v, ON_ERROR_STOP=1, -f, /docker-entrypoint-initdb.d/crear-rol-replicacion.sql]
    depends_on:
      db-principal: {condition: service_healthy}
    networks: [convoca-red]
    restart: 'no'

  # A6: standby físico persistente. No se inicia en el flujo normal de A4.
  db-replica:
    image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    profiles: [replica]
    entrypoint: [sh, /usr/local/bin/replica-entrypoint.sh]
    command: [postgres, -c, config_file=/etc/postgresql/lab.conf, -c, hot_standby=on]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      REPLICATION_USER: convoca_replicator
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Configurar REPLICATION_PASSWORD en infra/hia/.env}
      PGDATA: /var/lib/postgresql/data
      PGPASSFILE: /var/lib/postgresql/.pgpass
    ports: ["127.0.0.1:${LAB_REPLICA_DB_PORT:-5436}:5432"]
    volumes:
      - replica_v2:/var/lib/postgresql/data
      - replica_logs_v2:/var/log/postgresql
      - ./postgresql/logging.conf:/etc/postgresql/lab.conf:ro
      - ./postgresql/pg_hba.conf:/etc/postgresql/lab_hba.conf:ro
      - ./postgresql/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d postgres']
      interval: 3s
      timeout: 3s
      retries: 30
      # La primera inicialización hace un pg_basebackup y puede tardar varios minutos.
      start_period: 3m
    depends_on:
      db-principal: {condition: service_healthy}
      replication-init: {condition: service_completed_successfully}
    networks: [convoca-red]
    restart: unless-stopped

  # Optativo: misma rutina que lab:backup, cada doce horas.
  backups:
    image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    profiles: [backups]
    environment:
      PGHOST: db-principal
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/usr/local/bin/backup-lab:ro
    entrypoint: [sh, -c, 'while true; do sh /usr/local/bin/backup-lab convoca_lab_v2; sleep 43200; done']
    depends_on:
      db-principal: {condition: service_healthy}
    networks: [convoca-red]
    restart: unless-stopped

  pgbadger:
    profiles: [analisis]
    build: ./postgresql/pgbadger
    volumes:
      - logs_v2:/logs:ro
      - ./resultados:/resultados
    network_mode: none

  prometheus:
    profiles: [monitoreo]
    image: prom/prometheus:v2.53.1
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks: [convoca-red]
    restart: unless-stopped

  grafana:
    profiles: [monitoreo]
    image: grafana/grafana:11.1.0
    entrypoint: [sh, -ec, 'if [ "$${#GF_SECURITY_ADMIN_PASSWORD}" -lt 16 ]; then echo "Configurar una clave local de Grafana de al menos 16 caracteres"; exit 1; fi; exec /run.sh']
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [convoca-red]
    depends_on:
      - prometheus
    restart: unless-stopped

  node-exporter:
    profiles: [monitoreo]
    image: prom/node-exporter:v1.8.1
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ./resultados/docker-state:/textfile:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.textfile.directory=/textfile'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    expose: ["9100"]
    networks: [convoca-red]
    restart: unless-stopped

  cadvisor:
    profiles: [monitoreo]
    image: ghcr.io/google/cadvisor:0.60.6
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose: ["8080"]
    privileged: true
    command: ["--docker_only=true", "--housekeeping_interval=15s"]
    networks: [convoca-red]
    restart: unless-stopped

  postgres-exporter:
    profiles: [monitoreo]
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: "postgresql://convoca_monitor:${MONITOR_DB_PASSWORD:-}@db-principal:5432/postgres?sslmode=disable"
    expose: ["9187"]
    command: ["--extend.query-path=/etc/postgres-exporter/queries.yml"]
    volumes:
      - ./prometheus/queries.yml:/etc/postgres-exporter/queries.yml:ro
    networks: [convoca-red]
    depends_on:
      db-principal: {condition: service_healthy}
    restart: unless-stopped

  blackbox:
    profiles: [monitoreo]
    image: prom/blackbox-exporter:v0.25.0
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks: [convoca-red, publicacion]
    restart: unless-stopped

volumes:
  principal_v2:
  replica_v2:
  pgadmin_v2:
  logs_v2:
  replica_logs_v2:
  prometheus_data:
  grafana_data:
networks:
  publicacion:
    external: true
    name: convoca-publicacion
  convoca-red:
    driver: bridge
