convoca_activity:
  query: "SELECT count(*) FILTER (WHERE state='active') AS active, count(*) FILTER (WHERE state='active' AND query_start < now()-interval '1 second' AND pid<>pg_backend_pid()) AS slow_active FROM pg_stat_activity WHERE datname LIKE 'convoca_lab_%'"
  metrics:
    - active: {usage: GAUGE, description: Sesiones activas en bases de laboratorio}
    - slow_active: {usage: GAUGE, description: Consultas activas mayores a un segundo; no es historial de consultas lentas}
convoca_replication:
  query: "SELECT count(*) AS replicas, coalesce(max(pg_wal_lsn_diff(pg_current_wal_lsn(),replay_lsn)),0) AS lag_bytes FROM pg_stat_replication"
  metrics:
    - replicas: {usage: GAUGE, description: Replicas conectadas; cero no significa sincronizada}
    - lag_bytes: {usage: GAUGE, description: Mayor retraso en bytes entre replicas conectadas}
