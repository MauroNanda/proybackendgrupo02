include:
  - path: ./hia/docker-compose.yml
    env_file: ./hia/.env

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: development
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${API_DB_HOST:-db-principal}:5432/convoca_lab_piloto_v2
      DB_SSL: "false"
      JWT_SECRET: ${API_JWT_SECRET:?Configurar API_JWT_SECRET en infra/hia/.env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      db-principal:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - convoca-red
    restart: unless-stopped
