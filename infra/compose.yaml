# Reutiliza la base y los volúmenes del laboratorio; no crea otra arquitectura.
include:
  - path: ./hia/docker-compose.yml
    env_file: ./hia/.env

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: development
    environment:
      NODE_ENV: development
      PORT: 3000
      # Entre contenedores se usa el nombre del servicio, no localhost.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${API_DB_HOST:-db-principal}:5432/convoca_lab_piloto_v2
      DB_SSL: "false"
      JWT_SECRET: ${API_JWT_SECRET:?Configurar API_JWT_SECRET en infra/hia/.env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      N8N_SECURITY_WEBHOOK_URL: ${N8N_SECURITY_WEBHOOK_URL:-}
      N8N_SECURITY_WEBHOOK_TOKEN: ${N8N_SECURITY_WEBHOOK_TOKEN:-}
      API_RATE_MAX: ${API_RATE_MAX:-300}
      API_RATE_WINDOW_MS: ${API_RATE_WINDOW_MS:-300000}
    extra_hosts: ["host.docker.internal:host-gateway"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    # Espera a PostgreSQL antes de iniciar la API; las migraciones se aplican aparte.
    depends_on:
      db-principal:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(async r=>process.exit(r.ok && (await r.json()).database==='up'?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - convoca-red
    restart: unless-stopped
