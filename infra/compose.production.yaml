services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: production
    image: convoca-api:production
    environment:
      NODE_ENV: production
      PORT: 3000
      # Recibe una base ya preparada y accesible; este Compose no levanta PostgreSQL.
      DATABASE_URL: ${DATABASE_URL:?Configurar DATABASE_URL en el entorno de publicación}
      DB_SSL: ${DB_SSL:-true}
      JWT_SECRET: ${JWT_SECRET:?Configurar JWT_SECRET en el entorno de publicación}
      CORS_ORIGIN: ${CORS_ORIGIN:?Configurar CORS_ORIGIN en el entorno de publicación}
      FRONTEND_URL: ${FRONTEND_URL:?Configurar FRONTEND_URL en el entorno de publicación}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      N8N_SECURITY_WEBHOOK_URL: ${N8N_SECURITY_WEBHOOK_URL:-}
      N8N_SECURITY_WEBHOOK_TOKEN: ${N8N_SECURITY_WEBHOOK_TOKEN:-}
      API_RATE_MAX: ${API_RATE_MAX:-300}
      API_RATE_WINDOW_MS: ${API_RATE_WINDOW_MS:-300000}
    extra_hosts: ["host.docker.internal:host-gateway"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Un proceso comprometido no puede modificar los archivos de la imagen.
    read_only: true
    # Los temporales autorizados viven en memoria y se pierden al recrear el contenedor.
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3000}:3000"
    
    networks:
      - convoca-publicacion
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(async r=>process.exit(r.ok && (await r.json()).database==='up'?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped




networks:
  convoca-publicacion:
    # Backend y Nginx comparten esta red, creada antes de publicar.
    external: true
