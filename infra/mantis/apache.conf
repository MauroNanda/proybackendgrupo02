
<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>

# La administracion web permanece bloqueada.
<LocationMatch "^/admin(/|$)">
    Require all denied
</LocationMatch>

# La API REST solo acepta conexiones desde la red interna de Docker.
<LocationMatch "^/api/rest(/|$)">
    Require ip 172.28.0.0/16
</LocationMatch>

# La API SOAP permanece bloqueada.
<LocationMatch "^/api/soap(/|$)">
    Require all denied
</LocationMatch>

ServerName localhost
