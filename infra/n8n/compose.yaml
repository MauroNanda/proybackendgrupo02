name: convoca-n8n

services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Falta N8N_ENCRYPTION_KEY en infra/n8n/.env}
      GENERIC_TIMEZONE: America/Argentina/Jujuy
      TZ: America/Argentina/Jujuy
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      MANTIS_API_TOKEN: ${MANTIS_API_TOKEN:?Falta MANTIS_API_TOKEN}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:?Falta DISCORD_WEBHOOK_URL}
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data: